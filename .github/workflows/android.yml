name: Android APK

on:
  push:
    branches: [main, feature/http-lan-proxy-auth, feature/doh-fail-closed-release, feature/sing-box-gpl3-integration]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK (API 26+, ARM64 + ARM32)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout with pinned upstream submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: upstream/usque-android/go.mod
          cache-dependency-path: upstream/usque-android/go.sum

      - name: Set up Android SDK, API 34 and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264"

      - name: Download pinned sing-box libbox AAR
        run: |
          set -euo pipefail
          mkdir -p upstream/usque-android/android/usque-vpn/app/libs
          curl -fL --retry 3 https://github.com/singbox-android/libbox/releases/download/1.14.4/libbox.aar -o upstream/usque-android/android/usque-vpn/app/libs/libbox.aar
          echo "d2685924a657705beda44e94c6dc499e781df1ad20d65474e3591ec2f8b96465  upstream/usque-android/android/usque-vpn/app/libs/libbox.aar" | sha256sum -c -

      - name: Configure Android NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Verify pinned upstream revision
        run: |
          expected="$(tail -n 1 UPSTREAM_COMMIT)"
          actual="$(git -C upstream/usque-android rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "Building upstream commit $actual"

      - name: Apply JianxianAPP Warp branding and UI customizations
        run: python3 scripts/customize-upstream.py

      - name: Apply Hide Wi-Fi branding and authenticated LAN HTTP proxy
        run: python3 scripts/customize-hide-wifi.py

      - name: Prepare sing-box Android dependency
        run: python3 scripts/integrate-sing-box.py

      - name: Build Go Android AAR for both ABIs
        working-directory: upstream/usque-android/android
        run: |
          make init
          make android
          mkdir -p usque-vpn/app/libs
          cp usque.aar usque-vpn/app/libs/usque.aar

      - name: Enforce Android 8.0 minimum
        run: |
          sed -i 's/minSdk = 24/minSdk = 26/' upstream/usque-android/android/usque-vpn/app/build.gradle.kts
          grep -q 'minSdk = 26' upstream/usque-android/android/usque-vpn/app/build.gradle.kts

      - name: Prepare release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          key="$RUNNER_TEMP/hide-wifi-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key"
          test -s "$key"
          echo "ANDROID_KEYSTORE_FILE=$key" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: upstream/usque-android/android/usque-vpn
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Build debug APK for CI validation
        if: "!startsWith(github.ref, 'refs/tags/v')"
        working-directory: upstream/usque-android/android/usque-vpn
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Verify signed release APK and native ABIs
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          apk="upstream/usque-android/android/usque-vpn/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -l "$apk" | tee apk-files.txt
          grep -q 'lib/arm64-v8a/' apk-files.txt
          grep -q 'lib/armeabi-v7a/' apk-files.txt
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -v 4 "$apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p dist
          cp "$apk" dist/Hide-WiFi-v1.4.0.apk
          sha256sum dist/Hide-WiFi-v1.4.0.apk > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Verify debug APK for CI validation
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          set -euo pipefail
          apk="upstream/usque-android/android/usque-vpn/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -l "$apk" | tee apk-files.txt
          grep -q 'lib/arm64-v8a/' apk-files.txt
          grep -q 'lib/armeabi-v7a/' apk-files.txt
          mkdir -p dist
          cp "$apk" dist/Hide-WiFi-debug.apk
          sha256sum dist/Hide-WiFi-debug.apk > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hide-WiFi-v1.4.0-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Hide Wi-Fi $GITHUB_REF_NAME" \
              --notes "Signed Android release build. Android 8.0+; arm64-v8a and armeabi-v7a. See release notes for verified DNS security behavior and known limitations."
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
